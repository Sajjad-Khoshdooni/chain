[package]
name = "chain"
version = "0.1.0"
edition = "2021"
authors = ["Sajad Khoshdooni Farahani <sajjad.farahani@ut.ac.ir>"]
description = "Chain - A scalable blockchain implementation with master and side chains"

[lib]
name = "chain"
path = "src/lib.rs"

[[bin]]
name = "chain"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

version: '3.8'

services:
  chain:
    build:
      context: .
      dockerfile: Dockerfile
    image: chain:latest
    container_name: chain
    restart: unless-stopped
    environment:
      - RUST_LOG=info
    networks:
      - chain-network
    # Uncomment to persist data
    # volumes:
    #   - ./data:/home/chain/data

networks:
  chain-network:
    driver: bridge

